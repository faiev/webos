name: Build and deploy WebOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILDROOT_SRC: /tmp/buildroot-src
      BUILDROOT_OUT: /tmp/buildroot-output
      WEBOS_EXTERNAL: ${{ github.workspace }}/os/buildroot-external
      BUILD_CACHE: ${{ github.workspace }}/build-cache/linux
    steps:
      - name: Check out WebOS
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld llvm make git curl wget \
            xz-utils bc bison flex cpio rsync unzip file python3 perl gawk patch nasm qemu-system-x86 \
            libncurses-dev libssl-dev libelf-dev

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check out pinned v64 source
        uses: actions/checkout@v4
        with:
          repository: speedyHKjournalist/v64
          ref: 6448e1f3e6140684d1294aba67e91f46e924b3f3
          path: vendor/v64

      - name: Build v64 browser runtime
        run: |
          make -C vendor/v64 -j2 all
          mkdir -p _site/assets/v64/bios
          cp vendor/v64/build/libv86.js _site/assets/v64/libv86.js
          cp vendor/v64/build/v86.wasm _site/assets/v64/v86.wasm
          cp vendor/v64/bios/seabios.bin _site/assets/v64/bios/seabios.bin
          cp vendor/v64/bios/vgabios.bin _site/assets/v64/bios/vgabios.bin
          cp vendor/v64/LICENSE _site/assets/v64/LICENSE
          test -s _site/assets/v64/libv86.js
          test -s _site/assets/v64/v86.wasm

      - name: Restore cached x86-64 Linux build
        id: linux-cache
        uses: actions/cache/restore@v4
        with:
          path: build-cache/linux
          key: webos-linux-x86_64-br2026.08.2-linux6.18.7-v1-${{ hashFiles('os/buildroot-external/**') }}

      - name: Download pinned Buildroot release
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --retry 3 \
            https://buildroot.org/downloads/buildroot-2026.08.2.tar.xz \
            --output /tmp/buildroot.tar.xz
          mkdir -p "$BUILDROOT_SRC"
          tar -xJf /tmp/buildroot.tar.xz -C "$BUILDROOT_SRC" --strip-components=1

      - name: Configure and build 64-bit WebOS Linux
        if: steps.linux-cache.outputs.cache-hit != 'true'
        run: |
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" BR2_EXTERNAL="$WEBOS_EXTERNAL" webos_defconfig
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" BR2_EXTERNAL="$WEBOS_EXTERNAL" olddefconfig
          grep -qx 'BR2_x86_64=y' "$BUILDROOT_OUT/.config"
          grep -qx 'BR2_x86_x86_64=y' "$BUILDROOT_OUT/.config"
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" BR2_EXTERNAL="$WEBOS_EXTERNAL" -j"$(nproc)"
          test -s "$BUILDROOT_OUT/images/bzImage"
          test -s "$BUILDROOT_OUT/images/rootfs.cpio.gz"
          grep -qx 'CONFIG_64BIT=y' "$BUILDROOT_OUT/build/linux-6.18.7/.config"
          grep -qx 'CONFIG_X86_64=y' "$BUILDROOT_OUT/build/linux-6.18.7/.config"
          file "$BUILDROOT_OUT/target/bin/busybox" | grep -q 'ELF 64-bit'

          mkdir -p "$BUILD_CACHE/os" "$BUILD_CACHE/licenses/buildroot"
          cp "$BUILDROOT_OUT/images/bzImage" "$BUILD_CACHE/os/bzImage"
          cp "$BUILDROOT_OUT/images/rootfs.cpio.gz" "$BUILD_CACHE/os/rootfs.cpio.gz"
          cp "$BUILDROOT_OUT/target/bin/busybox" "$BUILD_CACHE/busybox"
          make -C "$BUILDROOT_SRC" O="$BUILDROOT_OUT" BR2_EXTERNAL="$WEBOS_EXTERNAL" legal-info
          cp -R "$BUILDROOT_OUT/legal-info/." "$BUILD_CACHE/licenses/buildroot/"
          printf '%s\n' 'architecture=x86_64' 'buildroot=2026.08.2' 'kernel=6.18.7' > "$BUILD_CACHE/build-info.txt"

      - name: Verify cached x86-64 Linux build
        run: |
          test -s "$BUILD_CACHE/os/bzImage"
          test -s "$BUILD_CACHE/os/rootfs.cpio.gz"
          test -s "$BUILD_CACHE/busybox"
          test -s "$BUILD_CACHE/licenses/buildroot/manifest.csv"
          file "$BUILD_CACHE/busybox" | grep -q 'ELF 64-bit'
          cat "$BUILD_CACHE/build-info.txt"

      - name: Save reusable x86-64 Linux build cache
        if: steps.linux-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-cache/linux
          key: webos-linux-x86_64-br2026.08.2-linux6.18.7-v1-${{ hashFiles('os/buildroot-external/**') }}

      - name: Preserve compiled Linux files before tests
        uses: actions/upload-artifact@v4
        with:
          name: webos-linux-x86_64
          path: build-cache/linux/
          if-no-files-found: error
          retention-days: 14

      - name: Boot-check x86-64 Linux and BusyBox in QEMU
        run: |
          set +e
          timeout --signal=TERM 60s qemu-system-x86_64 \
            -machine pc -cpu qemu64 -m 512M -smp 1 \
            -kernel "$BUILD_CACHE/os/bzImage" \
            -initrd "$BUILD_CACHE/os/rootfs.cpio.gz" \
            -append "console=tty0 console=ttyS0,115200n8 rdinit=/sbin/init loglevel=4" \
            -display none -serial stdio -monitor none -no-reboot \
            > /tmp/webos-boot.log 2>&1
          qemu_status=$?
          set -e
          if [ "$qemu_status" -ne 124 ] && [ "$qemu_status" -ne 0 ]; then
            cat /tmp/webos-boot.log
            exit "$qemu_status"
          fi
          if ! grep -Fq "Architecture: x86_64" /tmp/webos-boot.log; then
            cat /tmp/webos-boot.log
            echo "The Linux guest did not report the x86_64 architecture."
            exit 1
          fi
          if ! grep -Fq "WEBOS_BOOT_COMPLETE" /tmp/webos-boot.log; then
            cat /tmp/webos-boot.log
            echo "Linux did not reach the WebOS userspace boot marker."
            exit 1
          fi
          echo "Verified: x86_64 Linux kernel and 64-bit BusyBox userspace booted."

      - name: Assemble static Pages site
        run: |
          cp index.html _site/index.html
          cp -R assets/css assets/js assets/icons _site/assets/
          mkdir -p _site/docs
          cp docs/ARCHITECTURE.md _site/docs/ARCHITECTURE.md
          cp CREDITS.md _site/CREDITS.md
          mkdir -p _site/os _site/licenses/buildroot
          cp "$BUILD_CACHE/os/bzImage" _site/os/bzImage
          cp "$BUILD_CACHE/os/rootfs.cpio.gz" _site/os/rootfs.cpio.gz
          cp -R "$BUILD_CACHE/licenses/buildroot/." _site/licenses/buildroot/
          cp "$BUILD_CACHE/build-info.txt" _site/linux-build-info.txt
          printf '%s\n' \
            '{' \
            '  "buildroot": "2026.08.2",' \
            '  "emulator": "v64",' \
            '  "v64Commit": "6448e1f3e6140684d1294aba67e91f46e924b3f3",' \
            '  "architecture": "x86_64",' \
            '  "cpuProfile": "x86-64-v1",' \
            '  "kernel": "6.18.7"' \
            '}' > _site/build-info.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/assets/v64/libv86.js
          test -s _site/assets/v64/v86.wasm
          test -s _site/os/bzImage
          test -s _site/os/rootfs.cpio.gz
          du -sh _site

      - name: Test x86-64 WebOS boot in headless Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory _site > /tmp/webos-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/ >/dev/null
          npm run test:browser

      - name: Upload downloadable site artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-pages
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
